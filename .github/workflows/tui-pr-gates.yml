name: KanoAgentSkills / TUI PR Gates

run-name: ${{ format('TUI_PR_gate_{0}_{1}_{2}', github.event_name, github.ref_name, github.run_number) }}

on:
  pull_request:
    paths:
      - "src/cpp/code/apps/kano_git_cli/**"
      - "src/cpp/code/apps/kano_git_tui/**"
      - "src/cpp/code/systems/kano_git_command/ui/**"
      - "src/cpp/code/systems/kano_git_command/runtime/**"
      - "src/cpp/code/systems/kano_git_command/commit_plan/**"
      - "src/cpp/code/systems/kano_git_core/audit/**"
      - "src/cpp/code/systems/kano_git_core/shell/**"
      - "src/cpp/code/systems/kano_git_core/workspace/**"
      - "src/cpp/code/tests/kano_git_tui_tests/**"
      - "src/cpp/code/tests/kano_git_commit_plan_tests/**"
      - "src/cpp/code/tests/run_tui_pr_focus.py"
      - "src/cpp/code/tests/CMakeLists.txt"
      - "assets/audit/schemas/**"
      - "src/cpp/CMakeLists.txt"
      - "src/cpp/CMakePresets.json"
      - "src/cpp/shared/infra/**"
      - "scripts/kog"
      - "scripts/kog.bat"
      - "pixi.toml"
      - ".gitmodules"
      - "src/cpp/shared/infra"
      - ".github/workflows/tui-pr-gates.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit, branch, or tag to reproduce (blank uses the selected workflow ref).
        required: false
        default: ""
        type: string
      checkpoint_regressions:
        description: Also run the bounded KOG-TSK-0142 CLI checkpoint inventory.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tui-pr-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tui-pr-focus:
    name: TUI PR focus (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            configure_preset: linux-ninja-clang
            build_preset: linux-ninja-clang-release
            fetchcontent_sources: src/cpp/out/obj/linux-ninja-clang/_deps/*-src
            application_dir: src/cpp/out/bin/linux-ninja-clang/release
            test_binary: src/cpp/out/bin/linux-ninja-clang/release/kano_git_tui_tests
            audit_test_binary: src/cpp/out/bin/linux-ninja-clang/release/kano_git_commit_plan_tests
          - platform: macos-arm64
            runner: macos-15
            configure_preset: macos-ninja-clang-arm64
            build_preset: macos-ninja-clang-arm64-release
            fetchcontent_sources: src/cpp/out/obj/macos-ninja-clang-arm64/_deps/*-src
            application_dir: src/cpp/out/bin/macos-ninja-clang-arm64/release
            test_binary: src/cpp/out/bin/macos-ninja-clang-arm64/release/kano_git_tui_tests
            audit_test_binary: src/cpp/out/bin/macos-ninja-clang-arm64/release/kano_git_commit_plan_tests
          - platform: windows-x64
            runner: windows-2025
            configure_preset: windows-ninja-msvc
            build_preset: windows-ninja-msvc-release
            fetchcontent_sources: src/cpp/out/obj/win-ninja-msvc/_deps/*-src
            application_dir: src/cpp/out/bin/windows-ninja-msvc/release
            test_binary: src/cpp/out/bin/windows-ninja-msvc/release/kano_git_tui_tests.exe
            audit_test_binary: src/cpp/out/bin/windows-ninja-msvc/release/kano_git_commit_plan_tests.exe
    defaults:
      run:
        shell: bash
    env:
      GIT_TERMINAL_PROMPT: "0"
      KOG_PR_GATE_PLATFORM: ${{ matrix.platform }}
      KOG_PR_GATE_OUTPUT: ci/tui-pr-gate/${{ matrix.platform }}
      KOG_CHECKPOINT_GATE_OUTPUT: ci/checkpoint-pr-gate/${{ matrix.platform }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Record checked-out source revision
        run: |
          set -euo pipefail
          git rev-parse HEAD > .tui-pr-gate-source-revision

      - name: Initialize bounded checkpoint evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_regressions }}
        run: |
          set -euo pipefail
          mkdir -p "$KOG_CHECKPOINT_GATE_OUTPUT"
          echo "result=not_run" > "$KOG_CHECKPOINT_GATE_OUTPUT/status.txt"
          {
            echo "platform=$KOG_PR_GATE_PLATFORM"
            echo "source_revision=$(tr -d '\r\n' < .tui-pr-gate-source-revision)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "selector=[KOG-TSK-0142]"
            echo "artifact_policy=junit-only-no-command-output-no-environment-export"
          } > "$KOG_CHECKPOINT_GATE_OUTPUT/manifest.txt"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up pinned Pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.67.2
          manifest-path: src/cpp/shared/infra/pixi.toml
          run-install: false
          cache: false

      - name: Restore immutable FetchContent source cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ matrix.fetchcontent_sources }}
          key: tui-pr-fetchcontent-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/cpp/CMakeLists.txt', 'src/cpp/CMakePresets.json') }}

      - name: Install locked shared-infra environment
        run: pixi install --locked --manifest-path src/cpp/shared/infra/pixi.toml

      - name: Build release TUI binaries
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src/cpp/shared/infra"
          case "$RUNNER_OS" in
            Windows)
              export KANO_CPP_ROOT="$GITHUB_WORKSPACE/src/cpp"
              source scripts/lib/windows_preset_build.sh
              kano_windows_run_preset "${{ matrix.configure_preset }}" "${{ matrix.build_preset }}" x64
              ;;
            macOS)
              (
                export INF_CPP_ROOT="$GITHUB_WORKSPACE/src/cpp"
                export KANO_CPP_ROOT="$INF_CPP_ROOT"
                export INF_BUILD_USE_LLVM=0
                source scripts/lib/unix_preset_build.sh
                set +u
                kano_cpp_run_unix_preset "${{ matrix.configure_preset }}" "${{ matrix.build_preset }}" INF
              )
              ;;
            Linux)
              bash scripts/self/build.sh "${{ matrix.configure_preset }}" "${{ matrix.build_preset }}"
              ;;
            *)
              echo "unsupported TUI PR gate runner: $RUNNER_OS" >&2
              exit 2
              ;;
          esac

      - name: Run exact TUI PR focus selector and release smoke
        run: |
          catalog_args=()
          if python src/cpp/code/tests/run_tui_pr_focus.py --help | grep -Fq -- "--required-catalog-test"; then
            catalog_args+=(
              --required-catalog-test "[KG-TSK-0135] catalog records pending incomplete and final lifecycle truth"
              --required-catalog-test "[KG-TSK-0135] catalog cursor binds its immutable generation and filter"
              --required-catalog-test "[KG-TSK-0135] cursor expiry and unknown catalog fields fail closed without clock sleeps"
              --required-catalog-test "[KG-TSK-0135] catalog truncated repository filter is data-less"
              --required-catalog-test "[KG-TSK-0135] no-Git null-source fallback publishes at the workspace catalog root"
              --required-catalog-test "[KG-TSK-0135] catalog held OS writer lock rejects publication without blocking"
              --required-catalog-test "[KG-TSK-0135] held OS writer lock leaves Reserve nonblocking and Finalize reconciles"
              --required-catalog-test "[KG-TSK-0135] only final catalog rows can enter pinned revalidation"
              --required-catalog-test "[KG-TSK-0135] Windows long paths publish query and revalidate through pinned catalog roots"
            )
          elif [[ "${{ github.event_name }}" != "workflow_dispatch" || -z "${{ inputs.source_ref }}" ]]; then
            echo "current TUI PR focus runner lacks required audit-catalog support" >&2
            exit 2
          else
            echo "::notice::Requested historical source predates the audit-catalog focus capability; running its original bounded inventory."
          fi
          python src/cpp/code/tests/run_tui_pr_focus.py \
            --application-dir "${{ matrix.application_dir }}" \
            --test-binary "${{ matrix.test_binary }}" \
            --audit-test-binary "${{ matrix.audit_test_binary }}" \
            --output-dir "$KOG_PR_GATE_OUTPUT" \
            --required-tui-test "TUI first frame schedules startup I/O after ScreenInteractive activation and handles q while pending" \
            --required-tui-test "redirected standard streams reject both interactive TUI entrypoints cleanly" \
            --required-tui-test "audit receipt truth projects verified and typed reader outcomes" \
            --required-tui-test "production standalone TUI owns a ${{ matrix.platform == 'windows-x64' && 'Windows ConPTY' || 'POSIX' }} terminal lifecycle/q exits after live resize and production UTF-8 rendering" \
            --required-tui-test "production standalone TUI owns a ${{ matrix.platform == 'windows-x64' && 'Windows ConPTY' || 'POSIX' }} terminal lifecycle/Escape exits after live resize and production UTF-8 rendering" \
            --required-audit-test "[KG-TSK-0133] pinned audit evidence directory survives visible namespace replacement" \
            --required-audit-test "[KG-TSK-0133] legacy verify retains one pinned attempt across namespace replacement" \
            --required-audit-test "KG-TSK-0130 audit reader fails closed on evidence mutations" \
            "${catalog_args[@]}" \
            --timeout-seconds 1200

      - name: Run exact cooperative checkpoint CLI inventory
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_regressions }}
        env:
          KOG_CHECKPOINT_APPLICATION_DIR: ${{ matrix.application_dir }}
        run: |
          python - <<'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sys.path.insert(0, str(Path("src/cpp/code/tests").resolve()))
          from run_tui_pr_focus import run_focus_suite, write_status

          required = {
              "cooperative checkpoint preserves staged and working versions before an own-only commit",
              "cooperative checkpoint separates path-normalized LF and CRLF edits without changing raw WIP",
              "cooperative checkpoint captured blobs survive prune before own-only commit",
              "cooperative checkpoint uses index attributes when the working attributes file is deleted",
              "cooperative checkpoint preserves working ancestor attributes over indexed fallback",
              "cooperative checkpoint detects reference-hook writer drift before reporting saved",
              "cooperative checkpoint refuses secret clean-filter output without archiving it",
              "cooperative checkpoint pins base staged and raw working snapshots across destructive prune",
              "cooperative checkpoint excludes root and nested sensitive directories before writing objects",
              "cooperative checkpoint blocks binary split and same-hunk mixed ownership",
              "cooperative checkpoint rejects secret lock and changed base without losing WIP",
              "cooperative checkpoint keeps a diverged remote and a rejecting hook outside own history",
          }
          output = Path(os.environ["KOG_CHECKPOINT_GATE_OUTPUT"])
          junit = output / "checkpoint-pr-focus.junit.xml"
          status = output / "status.txt"
          suffix = ".exe" if sys.platform == "win32" else ""
          binary = Path(os.environ["KOG_CHECKPOINT_APPLICATION_DIR"]) / f"kano_git_cli_tests{suffix}"
          try:
              run_focus_suite(
                  label="cooperative-checkpoint", binary=binary.resolve(),
                  selector="[KOG-TSK-0142]", junit_path=junit,
                  timeout_seconds=1200, required_cases=required,
              )
              root = ET.parse(junit).getroot()
              cases = root.findall(".//testcase")
              if len(cases) != len(required) or {case.attrib.get("name") for case in cases} != required:
                  raise SystemExit("checkpoint JUnit inventory differs from the exact 12 required cases")
              suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
              assertions = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
              if assertions <= 0:
                  raise SystemExit("checkpoint JUnit contains no executed assertions")
              for outcome in ("failures", "errors", "skipped"):
                  if any(int(suite.attrib.get(outcome, "0")) != 0 for suite in suites):
                      raise SystemExit(f"checkpoint JUnit reports {outcome}")
              if any(root.findall(f".//{outcome}") for outcome in ("failure", "error", "skipped")):
                  raise SystemExit("checkpoint JUnit contains failed, errored, or skipped cases")
              status.write_text(
                  f"result=passed\ncase_count={len(cases)}\nassertion_count={assertions}\n",
                  encoding="utf-8",
              )
          except BaseException:
              write_status(status, "failed")
              raise
          PY

      - name: Write bounded artifact manifest
        if: always()
        run: |
          mkdir -p "$KOG_PR_GATE_OUTPUT"
          {
            echo "platform=$KOG_PR_GATE_PLATFORM"
            echo "source_revision=$(tr -d '\\r\\n' < .tui-pr-gate-source-revision)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "artifact_policy=junit-only-no-command-output-no-environment-export"
          } > "$KOG_PR_GATE_OUTPUT/manifest.txt"

      - name: Upload bounded TUI PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-pr-gate-${{ matrix.platform }}
          path: |
            ci/tui-pr-gate/${{ matrix.platform }}/tui-pr-focus.junit.xml
            ci/tui-pr-gate/${{ matrix.platform }}/audit-pr-focus.junit.xml
            ci/tui-pr-gate/${{ matrix.platform }}/audit-catalog-pr-focus.junit.xml
            ci/tui-pr-gate/${{ matrix.platform }}/status.txt
            ci/tui-pr-gate/${{ matrix.platform }}/manifest.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Upload bounded checkpoint evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.checkpoint_regressions }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checkpoint-pr-gate-${{ matrix.platform }}
          path: |
            ci/checkpoint-pr-gate/${{ matrix.platform }}/checkpoint-pr-focus.junit.xml
            ci/checkpoint-pr-gate/${{ matrix.platform }}/status.txt
            ci/checkpoint-pr-gate/${{ matrix.platform }}/manifest.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
